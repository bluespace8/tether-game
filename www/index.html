<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070d">
<title>Tether</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="safe-probe"></div>

<section id="screen-cards" class="screen" hidden>
  <h1 id="cards-title">Sector cleared</h1>
  <p id="cards-sub" class="sub"></p>
  <div id="cards-list"></div>
  <p id="cards-hint" class="sub">Tap a card to select it</p>
  <button id="cards-take" class="primary" type="button" disabled>Take</button>
</section>

<button id="btn-pause" class="hud-btn" type="button" aria-label="Pause">II</button>

<section id="screen-pause" class="screen" hidden>
  <h1>PAUSED</h1>
  <div class="spacer"></div>
  <button id="pause-resume" class="primary" type="button">Resume</button>
  <button id="pause-restart" class="secondary" type="button">Restart</button>
  <button id="pause-quit" class="secondary" type="button">Quit</button>
  <div class="spacer"></div>
</section>

<section id="screen-over" class="screen" hidden>
  <h1 id="over-title">RUN OVER</h1>
  <div class="spacer"></div>
  <div class="sub">SCORE</div>
  <div id="over-score" class="big">0</div>
  <div id="over-sector" class="stat"></div>
  <div id="over-delivered" class="stat"></div>
  <div id="over-extra" class="stat"></div>
  <div class="spacer"></div>
  <button id="over-again" class="primary" type="button">Play again</button>
</section>

<script src="game.js"></script>
<script src="render.js"></script>
<script src="input.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
</body>
</html>
